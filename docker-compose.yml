# Прод-контур из ТЗ. На этой машине Docker пока не установлен —
# API фазы 1 работает на in-memory store. Когда Docker появится:
#   docker compose up -d postgis redis
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: superapp-postgis
    environment:
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: superapp
      POSTGRES_DB: superapp
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapp -d superapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: superapp-redis
    ports:
      - "6379:6379"

volumes:
  postgis_data:
