# Только локальная разработка. Боевой стек — deploy/docker-compose.prod.yml.
# PostgreSQL и Redis доступны в сети compose. Порты 5432 и 6379 на хост не публикуются.
#   docker compose up -d postgis redis
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: superapp-postgis
    environment:
      POSTGRES_USER: superapp
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: superapp
    expose:
      - "5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superapp -d superapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: superapp-redis
    expose:
      - "6379"

volumes:
  postgis_data:
