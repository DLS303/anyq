name: Ops checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  alembic-heads:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Alembic has one head
        run: |
          set -euo pipefail
          heads="$(alembic heads)"
          printf '%s\n' "$heads"
          count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "expected exactly one alembic head, found ${count}"
            exit 1
          fi
