name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.17.1"
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: python -m pytest -q
        env:
          ANYQ_ENV: development
          JWT_SECRET: test-only-secret-value-with-32-characters
          ANYQ_DEMO_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        working-directory: apps/web
        run: npm test
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the current tree
        # The gitleaks binary is MIT-licensed. Full-history cleanup is a separate
        # decision and is not done from a pull request.
        run: gitleaks detect --source . --no-git --redact --verbose

  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: anyq
          POSTGRES_PASSWORD: anyq
          POSTGRES_DB: anyq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anyq -d anyq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.17.1" pytest-xdist
      - name: Migrate
        env:
          DATABASE_URL: postgresql+psycopg://anyq:anyq@127.0.0.1:5432/anyq
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Pytest
        env:
          DATABASE_URL: postgresql+psycopg://anyq:anyq@127.0.0.1:5432/anyq
          ANYQ_TEST_POSTGRES: "1"
          ANYQ_ENV: development
          JWT_SECRET: test-only-secret-value-with-32-characters
          ANYQ_DEMO_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000
        run: python -m pytest -q -n 2

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t anyq-api:ci apps/api
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=example.test -e ACME_EMAIL=ci@example.test -v "$PWD:/srv:ro" -w /srv caddy:2 caddy validate --config deploy/Caddyfile
