name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.17.1"
      - name: Ruff
        run: ruff check .
      - name: One migration head
        run: |
          count="$(alembic heads | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "expected one alembic head" >&2
            alembic heads >&2
            exit 1
          fi
      - name: Migrate SQLite
        run: |
          rm -f /tmp/anyq-ci.sqlite
          DATABASE_URL=sqlite:////tmp/anyq-ci.sqlite alembic upgrade head
          DATABASE_URL=sqlite:////tmp/anyq-ci.sqlite alembic check
          DATABASE_URL=sqlite:////tmp/anyq-ci.sqlite alembic downgrade -1
          DATABASE_URL=sqlite:////tmp/anyq-ci.sqlite alembic upgrade head
          DATABASE_URL=sqlite:////tmp/anyq-ci.sqlite alembic check
      - name: Pytest
        run: python -m pytest -q
        env:
          ANYQ_ENV: development
          JWT_SECRET: test-only-secret-value-with-32-characters
          LOGIN_HASH_SECRET: test-only-login-hash-secret-value-32ch
          ANYQ_DEMO_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        working-directory: apps/web
        run: npm test
      - name: Lint
        working-directory: apps/web
        run: npm run lint
      - name: Typecheck
        working-directory: apps/web
        run: npx tsc --noEmit
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Audit npm dependencies
        run: bash scripts/ci/npm_audit.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan the current tree
        run: gitleaks detect --source . --no-git --redact --verbose --config .gitleaks.toml
      - name: Scan the pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks detect --source . --redact --verbose --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Scan pushed commits
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          gitleaks detect --source . --redact --verbose --config .gitleaks.toml \
            --log-opts="${{ github.event.before }}..${{ github.sha }}"

  gitleaks-full-history:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
      - name: Scan full history
        run: gitleaks detect --source . --redact --verbose --config .gitleaks.toml

  api-postgres:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "ruff==0.17.1" pytest-xdist
      - name: Start PostgreSQL
        working-directory: ${{ github.workspace }}
        run: bash scripts/ci/start_postgres.sh
      - name: Migrate
        run: |
          test -n "$DATABASE_URL"
          count="$(alembic heads | grep -c '(head)' || true)"
          if [ "$count" -ne 1 ]; then
            echo "expected one alembic head" >&2
            alembic heads >&2
            exit 1
          fi
          alembic upgrade head
          alembic check
          alembic downgrade -1
          alembic upgrade head
          alembic check
      - name: Pytest
        env:
          ANYQ_TEST_POSTGRES: "1"
          ANYQ_ENV: development
          JWT_SECRET: test-only-secret-value-with-32-characters
          LOGIN_HASH_SECRET: test-only-login-hash-secret-value-32ch
          ANYQ_DEMO_PASSWORD: ""
          CORS_ORIGINS: http://localhost:3000
        run: python -m pytest -q -n 2

  docker-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t anyq-api:ci apps/api
      - name: Install trivy
        run: bash scripts/ci/install_trivy.sh
      - name: Report HIGH and CRITICAL
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --ignorefile .trivyignore.yaml --format sarif --output trivy-api.sarif anyq-api:ci
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --ignorefile .trivyignore.yaml anyq-api:ci
      - name: Save the HIGH report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-api-high
          path: trivy-api.sarif
          if-no-files-found: error
      - name: Fail on CRITICAL with a fix
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --ignorefile .trivyignore.yaml anyq-api:ci

  docker-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t anyq-web:ci .
      - name: Install trivy
        run: bash scripts/ci/install_trivy.sh
      - name: Report HIGH and CRITICAL
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --ignorefile .trivyignore.yaml --format sarif --output trivy-web.sarif anyq-web:ci
          trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 0 --no-progress \
            --ignorefile .trivyignore.yaml anyq-web:ci
      - name: Save the HIGH report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-web-high
          path: trivy-web.sarif
          if-no-files-found: error
      - name: Fail on CRITICAL with a fix
        run: trivy image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress --ignorefile .trivyignore.yaml anyq-web:ci

  repo-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install shellcheck and actionlint
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          bash scripts/ci/install_actionlint.sh
      - name: shellcheck
        run: shellcheck deploy/*.sh scripts/ci/*.sh
      - name: actionlint
        run: actionlint
      - name: Forbidden files
        run: |
          bash scripts/ci/check_forbidden_files.sh --self-test
          bash scripts/ci/check_forbidden_files.sh
      - name: Kazakhstan endpoints
        run: |
          bash scripts/ci/check_kz_endpoints.sh --self-test
          bash scripts/ci/check_kz_endpoints.sh
      - name: Migration contract
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/check_pr_migrations.sh
      - name: Production compose config
        run: bash scripts/ci/compose_config.sh
