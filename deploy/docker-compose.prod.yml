# Production stack for one VPS. Run from the repository:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.prod.yml up -d
# The API and web ports stay on the internal network. Caddy publishes 80 and 443.

name: anyq

services:
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    image: anyq-api:current
    container_name: ${ANYQ_API_CONTAINER:-anyq-api}
    env_file:
      - path: .env
        required: true
    environment:
      ANYQ_ENV: production
      ANYQ_DB_PATH: /data/db.json
      ANYQ_UPLOADS_DIR: /data/uploads
      ANYQ_DATA_DIR: /data
      LEGAL_DIR: /app/legal
      PORT: "8010"
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ANYQ_APP_PASSWORD: ${ANYQ_APP_PASSWORD:?set ANYQ_APP_PASSWORD}
      DATABASE_URL: postgresql+psycopg://anyq_app:${ANYQ_APP_PASSWORD}@postgres:5432/anyq
    volumes:
      - anyq-data:/data
      - ../apps/web/content/legal:/app/legal:ro
    expose:
      - "8010"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/v1/health/ready', timeout=6).read()"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 60s
    logging: &json_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1536M
        reservations:
          cpus: "0.25"
          memory: 256M
    networks:
      - anyq

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_PILOT_MODE: ${NEXT_PUBLIC_PILOT_MODE:-1}
        INTERNAL_API_URL: http://api:8010
        GIT_SHA: ${GIT_SHA:-}
    image: anyq-web:current
    container_name: anyq-web
    environment:
      NODE_ENV: production
      INTERNAL_API_URL: http://api:8010
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *json_logs
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 768M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - anyq

  caddy:
    image: caddy:2.10-alpine
    container_name: anyq-caddy
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *json_logs
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      - anyq

  migrate:
    image: anyq-api:current
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        BUILD_TIME: ${BUILD_TIME:-}
    env_file:
      - path: .env
        required: true
    environment:
      ANYQ_ENV: production
      ANYQ_DB_PATH: /data/db.json
      ANYQ_UPLOADS_DIR: /data/uploads
      ANYQ_DATA_DIR: /data
      LEGAL_DIR: /app/legal
      DOMAIN: ${DOMAIN:?set DOMAIN in deploy/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      ANYQ_APP_PASSWORD: ${ANYQ_APP_PASSWORD:?set ANYQ_APP_PASSWORD}
      DATABASE_URL: postgresql+psycopg://anyq:${POSTGRES_PASSWORD}@postgres:5432/anyq
    command: ["python", "-m", "app.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
      db-backup:
        condition: service_completed_successfully
    restart: "no"
    init: true
    networks:
      - anyq

  db-backup:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: anyq
      PGDATABASE: anyq
    volumes:
      - anyq-backups:/backups
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        file="/backups/pre-migrate-$$(date -u +%Y%m%dT%H%M%SZ).dump"
        pg_dump -Fc --no-owner -f "$$file"
        test -s "$$file"
        ls -1t /backups/pre-migrate-*.dump | awk 'NR>3' | while read -r old; do rm -f "$$old"; done
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    init: true
    networks:
      - anyq

  postgres:
    image: postgres:16-alpine
    container_name: anyq-postgres
    environment:
      POSTGRES_USER: anyq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: anyq
    volumes:
      - anyq-postgres:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anyq -d anyq"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *json_logs
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.10"
          memory: 128M
    networks:
      - anyq

networks:
  anyq:
    driver: bridge

volumes:
  anyq-data:
    name: anyq-data
  caddy-data:
    name: anyq-caddy-data
  caddy-config:
    name: anyq-caddy-config
  anyq-postgres:
    name: anyq-postgres
  anyq-backups:
    name: anyq-backups
